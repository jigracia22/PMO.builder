name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanitization check
        run: node scripts/check-sanitized.mjs

      - name: Unit tests
        # A bare directory (`node --test tests/`) is read as a single file on Node 22; the glob runs every test file.
        run: node --test "tests/**/*.test.mjs"

      # `claude plugin validate` is a local check: it needs no login and no API key.
      # The npm package ships the same native binary as the standalone installer.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate . --strict
          claude plugin validate plugins/pmo --strict
          claude plugin validate plugins/pmo-tracker-github --strict
